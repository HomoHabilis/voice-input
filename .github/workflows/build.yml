name: Build APK

# CI: builds the APK and renders the UI screenshots on every push. Results are kept as workflow
# artifacts (download them from the run page). Nothing is published here; releases are made by
# release.yml, which calls this workflow with a version.

on:
  push:
    branches: ["**"]
    paths-ignore: ["docs/screenshots/**"]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: "Release version (e.g. 1.2.1). Empty = development build."
        type: string
        required: false
        default: ""
    outputs:
      version_name:
        description: "The app version the APK was built with"
        value: ${{ jobs.build.outputs.version_name }}

# A newer push to the same branch replaces the running CI build. When release.yml calls this
# workflow, github.workflow is "Release", so it runs in its own group and never cancels
# (or is cancelled by) the normal CI builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: ${{ github.workflow == 'Build APK' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version_name: ${{ steps.version.outputs.name }}
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history and tags: the version comes from the last v* tag

      # Release: the version given by release.yml. Other builds: last release tag + commits since,
      # e.g. 0.1.0-dev.3+58aa471 (3 commits after v0.1.0).
      # Version code: grows with the commit count, so a build from later code installs over an
      # older one; a release outranks a development build of the same commit.
      - name: Work out app version
        id: version
        run: |
          last_tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          commits=$(git rev-list --count HEAD)
          if [ -n "$VERSION" ]; then
            name="${VERSION#v}"
            code=$((10000 + commits * 10 + 5))
          else
            base="${last_tag#v}"
            since=$(git rev-list --count ${last_tag:+$last_tag..}HEAD)
            name="${base:-0.0.0}-dev.${since}+$(git rev-parse --short HEAD)"
            code=$((10000 + commits * 10))
          fi
          echo "APP_VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "App version: $name (code $code)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Fetch libs submodule (FUTO android-libs, has the VAD library)
        run: git submodule update --init libs && ls -la libs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null

      - name: Fetch speech engines (sherpa-onnx for Parakeet, Cactus Needle for Whistle)
        run: ./scripts/fetch-native-deps.sh

      - name: Check that model download URLs used by the app are reachable
        run: |
          for url in \
            https://huggingface.co/csukuangfj/sherpa-onnx-nemo-parakeet-tdt-0.6b-v3-int8/resolve/main/encoder.int8.onnx \
            https://huggingface.co/csukuangfj/sherpa-onnx-nemo-parakeet-tdt-0.6b-v3-int8/resolve/main/decoder.int8.onnx \
            https://huggingface.co/csukuangfj/sherpa-onnx-nemo-parakeet-tdt-0.6b-v3-int8/resolve/main/joiner.int8.onnx \
            https://huggingface.co/csukuangfj/sherpa-onnx-nemo-parakeet-tdt-0.6b-v3-int8/resolve/main/tokens.txt \
            https://huggingface.co/Cactus-Compute/whistle/resolve/main/whistle.cact \
            https://voiceinput.futo.org/VoiceInput/tiny_en_acft_q8_0.bin; do
            size=$(curl -sfIL "$url" | grep -i '^content-length' | tail -1 | tr -d '\r' | awk '{print $2}')
            echo "$url -> ${size:-MISSING} bytes"
            [ -n "$size" ]
          done

      # Uses your own signing key if the KEYSTORE_* secrets are set, so updates install over each
      # other. Otherwise a debug key cached between runs is used.
      - name: Set up signing
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_FILE" ]; then ./setUpPropertiesCI.sh; else echo "No KEYSTORE_FILE secret, using debug key"; fi

      - name: Cache debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Build APK
        run: |
          ./gradlew assembleCustomRelease -PappVersionName="$APP_VERSION_NAME" -PappVersionCode="$APP_VERSION_CODE" --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/custom/release/app-custom-release.apk "dist/voice-input-custom-${APP_VERSION_NAME//+/_}.apk"

      - name: Check native libraries in APK
        run: |
          apk=app/build/outputs/apk/custom/release/app-custom-release.apk
          unzip -l "$apk" | grep '\.so$'
          unzip -l "$apk" | grep -q libsherpa-onnx-jni.so
          # Whistle is linked into libvoiceinput.so when the Needle engine was found
          unzip -p "$apk" lib/arm64-v8a/libvoiceinput.so > /tmp/libvoiceinput.so
          if nm -D --defined-only /tmp/libvoiceinput.so | grep -q needle_transcribe || strings /tmp/libvoiceinput.so | grep -q needle_transcribe; then
            echo "Whistle engine: linked"
          else
            echo "::warning::Whistle engine (libneedle) was not linked"
          fi

      # The APK is uploaded before the screenshot tests, so it is available even if they fail
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Render screenshots (Robolectric)
        run: ./gradlew testCustomDebugUnitTest --tests 'org.futo.voiceinput.ScreenshotTest' --stacktrace

      - name: Upload screenshots and test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            app/screenshots/*.png
            app/build/reports/tests/
          if-no-files-found: warn
