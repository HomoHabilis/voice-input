name: Build APK

on:
  push:
    branches: ["**"]
    paths-ignore: ["docs/screenshots/**"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Fetch libs submodule (FUTO android-libs, has the VAD library)
        run: git submodule update --init libs && ls -la libs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null

      - name: Fetch speech engines (sherpa-onnx for Parakeet, Cactus Needle for Whistle)
        run: ./scripts/fetch-native-deps.sh

      - name: Check that model download URLs used by the app are reachable
        run: |
          for url in \
            https://huggingface.co/csukuangfj/sherpa-onnx-nemo-parakeet-tdt-0.6b-v3-int8/resolve/main/encoder.int8.onnx \
            https://huggingface.co/csukuangfj/sherpa-onnx-nemo-parakeet-tdt-0.6b-v3-int8/resolve/main/decoder.int8.onnx \
            https://huggingface.co/csukuangfj/sherpa-onnx-nemo-parakeet-tdt-0.6b-v3-int8/resolve/main/joiner.int8.onnx \
            https://huggingface.co/csukuangfj/sherpa-onnx-nemo-parakeet-tdt-0.6b-v3-int8/resolve/main/tokens.txt \
            https://huggingface.co/Cactus-Compute/whistle/resolve/main/whistle.cact; do
            size=$(curl -sfIL "$url" | grep -i '^content-length' | tail -1 | tr -d '\r' | awk '{print $2}')
            echo "$url -> ${size:-MISSING} bytes"
            [ -n "$size" ]
          done

      # Uses your own signing key if the KEYSTORE_* secrets are set, so updates install over each
      # other. Otherwise a debug key cached between runs is used.
      - name: Set up signing
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_FILE" ]; then ./setUpPropertiesCI.sh; else echo "No KEYSTORE_FILE secret, using debug key"; fi

      - name: Cache debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Build APK
        run: ./gradlew assembleCustomRelease --stacktrace

      - name: Check native libraries in APK
        run: |
          apk=app/build/outputs/apk/custom/release/app-custom-release.apk
          unzip -l "$apk" | grep '\.so$'
          unzip -l "$apk" | grep -q libsherpa-onnx-jni.so
          # Whistle is linked into libvoiceinput.so when the Needle engine was found
          unzip -p "$apk" lib/arm64-v8a/libvoiceinput.so > /tmp/libvoiceinput.so
          if nm -D --defined-only /tmp/libvoiceinput.so | grep -q needle_transcribe || strings /tmp/libvoiceinput.so | grep -q needle_transcribe; then
            echo "Whistle engine: linked"
          else
            echo "::warning::Whistle engine (libneedle) was not linked"
          fi

      # A rolling pre-release so the APK can be downloaded straight from a phone
      - name: Publish APK as pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_REF_NAME//\//-}"
          cp app/build/outputs/apk/custom/release/app-custom-release.apk voice-input-custom.apk
          gh release delete "$tag" --yes --cleanup-tag || true
          gh release create "$tag" voice-input-custom.apk --prerelease --target "$GITHUB_SHA" \
            --title "Voice Input custom build ($GITHUB_REF_NAME)" \
            --notes "Built from ${GITHUB_SHA}. Parakeet v3, Whistle and Whisper engines, floating mic. Install the APK, then open the app and pick an engine under Model."

      - name: Render screenshots (Robolectric)
        run: ./gradlew testCustomDebugUnitTest --tests 'org.futo.voiceinput.ScreenshotTest' --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-input-custom
          path: |
            app/build/outputs/apk/custom/release/*.apk
            app/screenshots/*.png
            app/build/reports/tests/
          if-no-files-found: warn

      - name: Commit screenshots
        run: |
          mkdir -p docs/screenshots
          cp app/screenshots/*.png docs/screenshots/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then echo "Screenshots unchanged"; exit 0; fi
          git commit -m "Update UI screenshots [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
