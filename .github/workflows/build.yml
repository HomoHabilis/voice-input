name: Build APK

on:
  push:
    branches: ["**"]
    paths-ignore: ["docs/screenshots/**"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 1.2.1 (creates release v1.2.1). Leave empty for a test build."
        required: false
        default: ""
      notes:
        description: "Optional: what changed in this release"
        required: false
        default: ""

# Test builds of the same branch replace each other; a release run has its own group, so it
# never cancels (and is never cancelled by) the normal builds of master.
concurrency:
  group: ${{ inputs.version != '' && inputs.version != null && format('release-{0}', inputs.version) || format('build-{0}', github.ref) }}
  cancel-in-progress: ${{ inputs.version == '' || inputs.version == null }}

permissions:
  contents: write

env:
  VERSION: ${{ inputs.version }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check release version
        if: env.VERSION != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Version '$VERSION' should look like 1.2.1"; exit 1
          fi
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::Release v$VERSION already exists. Pick a new version."; exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history and tags: the version comes from the last v* tag

      # Release: the version you typed. Other builds: last release tag + commits since, e.g.
      # 0.1.0-dev.3+58aa471 (3 commits after v0.1.0). The version code grows with every run so a
      # newer APK always installs over an older one.
      - name: Work out app version
        run: |
          last_tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          if [ -n "$VERSION" ]; then
            name="$VERSION"
          else
            base="${last_tag#v}"
            count=$(git rev-list --count ${last_tag:+$last_tag..}HEAD)
            name="${base:-0.0.0}-dev.${count}+$(git rev-parse --short HEAD)"
          fi
          echo "APP_VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "PREVIOUS_TAG=$last_tag" >> "$GITHUB_ENV"
          echo "App version: $name (code $((1000 + GITHUB_RUN_NUMBER))), previous release: ${last_tag:-none}"

      - name: Fetch libs submodule (FUTO android-libs, has the VAD library)
        run: git submodule update --init libs && ls -la libs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null

      - name: Fetch speech engines (sherpa-onnx for Parakeet, Cactus Needle for Whistle)
        run: ./scripts/fetch-native-deps.sh

      - name: Check that model download URLs used by the app are reachable
        run: |
          for url in \
            https://huggingface.co/csukuangfj/sherpa-onnx-nemo-parakeet-tdt-0.6b-v3-int8/resolve/main/encoder.int8.onnx \
            https://huggingface.co/csukuangfj/sherpa-onnx-nemo-parakeet-tdt-0.6b-v3-int8/resolve/main/decoder.int8.onnx \
            https://huggingface.co/csukuangfj/sherpa-onnx-nemo-parakeet-tdt-0.6b-v3-int8/resolve/main/joiner.int8.onnx \
            https://huggingface.co/csukuangfj/sherpa-onnx-nemo-parakeet-tdt-0.6b-v3-int8/resolve/main/tokens.txt \
            https://huggingface.co/Cactus-Compute/whistle/resolve/main/whistle.cact; do
            size=$(curl -sfIL "$url" | grep -i '^content-length' | tail -1 | tr -d '\r' | awk '{print $2}')
            echo "$url -> ${size:-MISSING} bytes"
            [ -n "$size" ]
          done

      # Uses your own signing key if the KEYSTORE_* secrets are set, so updates install over each
      # other. Otherwise a debug key cached between runs is used.
      - name: Set up signing
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_FILE" ]; then ./setUpPropertiesCI.sh; else echo "No KEYSTORE_FILE secret, using debug key"; fi

      - name: Cache debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Build APK
        run: ./gradlew assembleCustomRelease -PappVersionName="$APP_VERSION_NAME" -PappVersionCode="$APP_VERSION_CODE" --stacktrace

      - name: Check native libraries in APK
        run: |
          apk=app/build/outputs/apk/custom/release/app-custom-release.apk
          unzip -l "$apk" | grep '\.so$'
          unzip -l "$apk" | grep -q libsherpa-onnx-jni.so
          # Whistle is linked into libvoiceinput.so when the Needle engine was found
          unzip -p "$apk" lib/arm64-v8a/libvoiceinput.so > /tmp/libvoiceinput.so
          if nm -D --defined-only /tmp/libvoiceinput.so | grep -q needle_transcribe || strings /tmp/libvoiceinput.so | grep -q needle_transcribe; then
            echo "Whistle engine: linked"
          else
            echo "::warning::Whistle engine (libneedle) was not linked"
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: |
          apk_src=app/build/outputs/apk/custom/release/app-custom-release.apk
          if [ -n "$VERSION" ]; then
            tag="v$VERSION"; apk="voice-input-custom-$VERSION.apk"; title="Voice Input $VERSION"
          else
            # Test builds: one rolling pre-release per branch
            tag="build-${GITHUB_REF_NAME//\//-}"; apk="voice-input-custom.apk"; title="Voice Input $APP_VERSION_NAME (test build, $GITHUB_REF_NAME)"
            gh release delete "$tag" --yes --cleanup-tag || true
          fi
          cp "$apk_src" "$apk"
          sha=$(sha256sum "$apk" | cut -d' ' -f1)

          # Commits since the previous release (or the last 30 if there is none)
          if [ -n "$PREVIOUS_TAG" ]; then
            changes=$(git log --no-merges --format='- %s (%h)' "$PREVIOUS_TAG..HEAD" | head -50)
            since="since $PREVIOUS_TAG"
          else
            changes=$(git log --no-merges --format='- %s (%h)' -30)
            since="(latest commits)"
          fi

          {
            if [ -n "$NOTES" ]; then echo "## Highlights"; echo; echo "$NOTES"; echo; fi
            echo "## Changes $since"
            echo
            echo "${changes:-- No code changes}"
            echo
            echo "## Install"
            echo "1. Download **$apk** below on your phone and open it (allow installs from your browser if asked)."
            echo "2. Open **Voice Input (custom)** and follow the setup."
            echo "3. Under **Model**, pick a speech engine. Its model downloads the first time:"
            echo "   - **Parakeet TDT 0.6B v3**: best accuracy, about 640 MB"
            echo "   - **Whistle**: 17 MB, fastest; en, de, fr, es, it, nl, pl"
            echo "   - **Whisper**: 99 languages"
            echo "4. Under **Keyboard integration**, turn on the floating mic (Gboard) or set up FUTO Keyboard."
            echo
            echo "App id \`org.futo.voiceinput.custom\` (installs next to the official FUTO Voice Input). arm64 phones only."
            echo
            echo "## Build"
            echo "- App version: $APP_VERSION_NAME (version code $APP_VERSION_CODE)"
            echo "- Commit: $GITHUB_SHA"
            echo "- SHA-256: \`$sha\`"
            echo
          } > notes.md

          if [ -n "$VERSION" ]; then
            # --generate-notes appends GitHub's list of merged pull requests and a compare link
            gh release create "$tag" "$apk" --target "$GITHUB_SHA" --title "$title" --notes-file notes.md \
              --generate-notes ${PREVIOUS_TAG:+--notes-start-tag "$PREVIOUS_TAG"} --latest
          else
            gh release create "$tag" "$apk" --target "$GITHUB_SHA" --title "$title" --notes-file notes.md --prerelease
          fi
          echo "### Release: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"

      - name: Render screenshots (Robolectric)
        run: ./gradlew testCustomDebugUnitTest --tests 'org.futo.voiceinput.ScreenshotTest' --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-input-custom
          path: |
            app/build/outputs/apk/custom/release/*.apk
            app/screenshots/*.png
            app/build/reports/tests/
          if-no-files-found: warn

      - name: Commit screenshots
        run: |
          mkdir -p docs/screenshots
          cp app/screenshots/*.png docs/screenshots/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then echo "Screenshots unchanged"; exit 0; fi
          git commit -m "Update UI screenshots [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
